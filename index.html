<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&family=Montserrat:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="start-screen" aria-live="polite">
      <div class="start-screen__inner">
        <img
          src="jelly.png"
          alt="Jelly is ready to play"
          class="start-screen__image"
          decoding="async"
        />
        <p class="start-screen__title">Meet Jelly the tease cat!</p>
        <p class="start-screen__text">Tap the button to start the chase.</p>
        <button id="startButton" class="start-screen__button">
          Start Playing
        </button>
      </div>
    </div>

    <div
      class="loading-screen loading-screen--hidden loading-screen--gone"
      role="status"
      aria-live="polite"
    >
      <div class="loading-screen__inner">
        <div class="loading-screen__spinner" aria-hidden="true"></div>
        <p class="loading-screen__text">Warming up Jelly...</p>
      </div>
    </div>

    <main class="canvas" aria-busy="true">
      <div
        id="jellyCat"
        class="jelly-cat"
        role="button"
        tabindex="0"
        aria-label="Try to catch Jelly the cat"
        aria-controls="message"
        aria-description="Jelly the cat keeps running away until you catch them"
      >
        <img
          src="jelly.png"
          alt="Jelly the cat"
          class="jelly-cat__image"
          aria-hidden="true"
          decoding="async"
        />
        <span
          id="jellyCatTease"
          class="jelly-cat__tease"
          aria-live="polite"
        ></span>
      </div>
      <p
        id="message"
        class="message"
        aria-live="polite"
        aria-hidden="true"
      >
        Happy Birthday! 🎉
      </p>
      <div class="confetti" aria-hidden="true"></div>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
