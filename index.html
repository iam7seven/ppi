<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&family=Montserrat:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="start-screen" aria-live="polite">
      <div class="start-screen__inner">
        <img
          src="jelly.png"
          alt="Jelly is ready to play"
          class="start-screen__image"
          decoding="async"
        />
        <p class="start-screen__title">Hello are you ready to be surprised?</p>
        <p class="start-screen__text">click here</p>
        <button id="startButton" class="start-screen__button">
          🎉🎊🥳
        </button>
      </div>
    </div>

    <div
      class="loading-screen loading-screen--hidden loading-screen--gone"
      role="status"
      aria-live="polite"
    >
      <div class="loading-screen__inner">
        <div class="loading-screen__spinner" aria-hidden="true"></div>
        <p class="loading-screen__text">Warming up Jelly...</p>
      </div>
    </div>

    <main class="canvas" aria-busy="true">
      <div class="canvas__panel canvas__panel--left">
        <p class="canvas__label">Catch Jelly to unlock the wish</p>
        <div
          id="jellyCat"
          class="jelly-cat"
          role="button"
          tabindex="0"
          aria-label="Try to catch Jelly the cat"
          aria-controls="message"
          aria-description="Jelly the cat keeps running away until you catch them"
        >
          <img
            src="jelly.png"
            alt="Jelly the cat"
            class="jelly-cat__image"
            aria-hidden="true"
            decoding="async"
          />
          <span
            id="jellyCatTease"
            class="jelly-cat__tease"
            aria-live="polite"
          ></span>
        </div>
        <p
          id="message"
          class="message"
          aria-live="polite"
          aria-hidden="true"
        >
          Happy Birthday! 🎉
        </p>
      </div>

      <div class="canvas__panel canvas__panel--right">
        <section
          id="cakeSection"
          class="cake"
          aria-live="polite"
          aria-hidden="true"
        >
          <div class="cake__scene" aria-hidden="true">
            <div class="cake__plate"></div>
            <div class="cake__layer cake__layer--bottom"></div>
            <div class="cake__layer cake__layer--middle"></div>
            <div class="cake__layer cake__layer--top">
              <span class="cake__frosting"></span>
              <span class="cake__candle">
                <span class="cake__flame"></span>
              </span>
            </div>
            <div class="cake__slice"></div>
            <div class="cake__knife"></div>
          </div>
          <button id="cakeButton" class="cake__button" type="button" disabled>
            Cut the Cake
          </button>
          <p
            id="cakeMessage"
            class="cake__message"
            aria-live="polite"
            aria-hidden="true"
          ></p>
        </section>
      </div>
      <div class="confetti" aria-hidden="true"></div>
    </main>

    <section
      id="letterSection"
      class="letter letter--hidden"
      aria-live="polite"
    >
      <div class="letter__paper">
        <p id="letterText" class="letter__text"></p>
        <span id="letterCursor" class="letter__cursor" aria-hidden="true"></span>
      </div>
    </section>
    <button
      id="audioToggle"
      class="audio-toggle"
      type="button"
      aria-pressed="false"
      aria-label="Mute background music"
    >
      <span class="audio-toggle__icon audio-toggle__icon--on" aria-hidden="true"
        >🔊</span
      >
      <span class="audio-toggle__icon audio-toggle__icon--off" aria-hidden="true"
        >🔇</span
      >
    </button>

    <audio id="celebrationAudio" src="birthday.mp3" preload="auto"></audio>

    <script src="script.js" defer></script>
  </body>
</html>
